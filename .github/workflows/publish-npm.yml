name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish
        required: true
        default: 0.1.0
      source_run:
        description: Release workflow run containing the packages
        required: true
        default: "35784883279"

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: cargo-packages
          path: artifacts/cargo-packages
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
          path: artifacts/linux-aarch64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: artifacts/macos-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: artifacts/macos-aarch64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/windows-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: artifacts/release-metadata
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - name: Publish native packages, then root package
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$NODE_AUTH_TOKEN"

          mapfile -t native_packages < <(
            find artifacts -type f \
              -name "rust-ml-runtime-node-*-${version}.tgz" \
              ! -name "rust-ml-runtime-node-${version}.tgz" \
              | sort
          )
          root_package="artifacts/macos-aarch64/rust-ml-runtime-node-${version}.tgz"
          test "${#native_packages[@]}" -eq 5
          test -f "$root_package"

          for package in "${native_packages[@]}"; do
            npm publish --access public "$package"
          done
          npm publish --access public "$root_package"
