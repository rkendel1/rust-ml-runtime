name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (0.2.0 only)
        required: true
        default: 0.2.0
      source_run:
        description: Release workflow run containing the version 0.2.0 artifacts
        required: true
        default: "35808900241"

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: cargo-packages
          path: artifacts/cargo-packages
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
          path: artifacts/linux-aarch64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: artifacts/macos-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-aarch64
          path: artifacts/macos-aarch64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/windows-x86_64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: artifacts/release-metadata
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - name: Inspect downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if [[ "$version" != "0.2.0" ]]; then
            echo "::error::This recovery workflow only publishes version 0.2.0 (received ${RELEASE_VERSION})"
            exit 1
          fi
          echo "Source release run: ${{ inputs.source_run }}"
          echo "Downloaded artifact files:"
          find artifacts -type f -print | sort
          if [[ -f artifacts/release-metadata/release-manifest.json ]]; then
            echo "Release manifest:"
            cat artifacts/release-metadata/release-manifest.json
          fi
          node tools/validate-node-packages.mjs artifacts "$version"
      - name: Publish native packages, then root package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN is missing"
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          npm whoami --registry=https://registry.npmjs.org >/dev/null
          npm run publish:packages -- --version "$version" --artifacts artifacts --npm-only
