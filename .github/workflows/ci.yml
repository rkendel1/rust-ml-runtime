name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            profile: cpu
          - os: macos-15-intel
            profile: cpu
          - os: macos-14
            profile: coreml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: node --test bindings/node/test/generation.test.cjs
      - run: cargo build --release -p ml-runtime-cli
        env:
          RUSTFLAGS: ""

  # Opt-in local inference (llama.cpp). Kept out of the matrix above: it needs
  # CMake, a C++ compiler and libclang, and compiles llama.cpp. Uses generated
  # fixtures only; it never downloads model weights.
  local-engine:
    name: local engine (synthetic fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: node --test tools/check-local-engine-isolation.test.mjs
      - run: node tools/check-local-engine-isolation.mjs
      - run: cargo fmt --check
        working-directory: providers/llama
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: providers/llama
      - run: cargo test --locked
        working-directory: providers/llama
      - run: cargo build --locked --release
        working-directory: bindings/node-llama

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: rust
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace
      - uses: github/codeql-action/analyze@v3
