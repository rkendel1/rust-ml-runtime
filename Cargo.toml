[workspace]
members = [
  "crates/common",
  "crates/model",
  "crates/inference",
  "crates/backend",
  "crates/provider",
  "crates/protocol",
  "crates/runtime",
  "crates/cli",
  "backends/cpu",
  "backends/coreml",
  "backends/onnx",
  "backends/cuda",
  "backends/webgpu",
  "providers/local",
  "providers/http",
  "providers/server",
  "bindings/node",
  "benchmarks",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.3"
repository = "https://github.com/rkendel1/rust-ml-runtime"
homepage = "https://github.com/rkendel1/rust-ml-runtime"

[workspace.dependencies]
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
