[package]
name = "ml-runtime-coreml-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
description = "Core ML backend for rust-ml-runtime"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/ml-runtime-coreml-backend"

[dependencies]
async-trait.workspace = true
futures-util.workspace = true
ml-runtime-common = { version = "0.2.3", path = "../../crates/common" }
ml-runtime-inference = { version = "0.2.3", path = "../../crates/inference" }
ml-runtime-backend = { version = "0.2.3", path = "../../crates/backend" }
ml-runtime-model = { version = "0.2.3", path = "../../crates/model" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"

[dev-dependencies]
tokio.workspace = true
