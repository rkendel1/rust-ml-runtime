[package]
name = "rust-ml-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native, model-neutral runtime for running local ML models"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rust-ml-runtime"
readme = "README.md"
keywords = ["machine-learning", "inference", "local", "runtime", "native"]
categories = ["science", "api-bindings"]
exclude = ["tests/**"]

[features]
default = []
coreml = ["dep:ml-runtime-coreml-backend"]

[[example]]
name = "laya"
required-features = ["coreml"]

[dependencies]
async-trait.workspace = true
futures-core.workspace = true
futures-util.workspace = true
ml-runtime-backend = { version = "0.2.0", path = "../backend" }
ml-runtime-common = { version = "0.2.0", path = "../common" }
ml-runtime-inference = { version = "0.2.0", path = "../inference" }
ml-runtime-model = { version = "0.2.0", path = "../model" }
ml-runtime-provider = { version = "0.2.0", path = "../provider" }
ml-runtime-cpu-backend = { version = "0.2.0", path = "../../backends/cpu" }
ml-runtime-http-provider = { version = "0.2.0", path = "../../providers/http" }
ml-runtime-onnx-backend = { version = "0.2.0", path = "../../backends/onnx" }
ml-runtime-coreml-backend = { version = "0.2.0", path = "../../backends/coreml", optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
