[package]
name = "ml-runtime-node"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
ml-runtime = { path = "../../crates/runtime", features = ["coreml"] }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json.workspace = true

[build-dependencies]
napi-build = "2"
